const cnt=a=>{const o={};a.forEach(x=>o[x]=(o[x]||0)+1);return o};

function rank(t){nz(t);const L=t.ps.map(p=>{const h=t.hands[p];return{p,n:t.nm[p],z:zs(h),c:h.length,m:Math.max(0,...h.map(x=>Z[x].z))}});L.sort((a,b)=>a.z-b.z||a.c-b.c||a.m-b.m);return L}

function adv(t,pen){nz(t);const p=t.ps[t.turn],h=t.hands[p];
 if(pen&&t.fin<0&&!t.ld){let n=0;for(let i=0;i<t.pen&&t.deck.length;i++){h.push(t.deck.pop());n++}if(n)lg(t,'🎴 '+t.nm[p]+' วางสารประกอบไม่ได้ จั่วเพิ่ม '+n+' ใบ')}
 if(t.fin>=0)t.fin--;else if(!t.deck.length)t.fin=t.ps.length-1;
 if(t.fin===0){t.st='done';lg(t,'🏁 จบเกมโต๊ะนี้!');return}
 t.turn=(t.turn+1)%t.ps.length;t.ld=0;t.dr=(!t.deck.length||t.fin>=0)?1:0}
function mv(fn){root.child('tables/'+MYT).transaction(t=>{if(!t||t.st!=='play'||t.ps[t.turn]!==ID)return;nz(t);return fn(t)===false?undefined:t})}
const draw=()=>mv(t=>{if(t.dr)return false;if(t.deck.length)t.hands[ID].push(t.deck.pop());t.dr=1});
const endT=()=>mv(t=>{if(!t.dr)return false;adv(t,1)});
function lay(i){closeM();SEL='';const r=R[i];mv(t=>{if(!t.dr)return false;const h=t.hands[ID].slice();for(const c of r.c){const k=h.indexOf(c);if(k<0)return false;h.splice(k,1)}t.hands[ID]=h;(t.laid[ID]=t.laid[ID]||[]).push(r.f);t.ld++;lg(t,'📣 '+t.nm[ID]+' เอ่ยชื่อ “'+r.th+'” ('+r.f+') แล้ววางไพ่ '+r.c.length+' ใบ')})}
function sayR(i){try{speechSynthesis.cancel();[[R[i].th.replace(/\(.*?\)/g,''),'th-TH'],[R[i].en,'en-US']].forEach(([x,l])=>{const u=new SpeechSynthesisUtterance(x);u.lang=l;speechSynthesis.speak(u)})}catch(e){}}
function ask(i){const r=R[i];$('#modal').innerHTML='<div><h2>📣 เอ่ยชื่อให้เพื่อนฟัง!</h2><h1 style="margin:.2em">'+esc(r.th)+'</h1><h3>'+r.f+' · '+esc(r.en)+'</h3><p>ใช้ไพ่: '+fmt(r.c)+'</p><button class="sm" onclick="sayR('+i+')">🔊 ฟังเสียงอ่าน</button><p>อ่านชื่อสารประกอบออกเสียงดัง ๆ ก่อน แล้วกดยืนยัน</p><div class="row" style="justify-content:center"><button class="ok" onclick="lay('+i+')">🗣️ เอ่ยแล้ว วางไพ่!</button><button onclick="closeM()">ยกเลิก</button></div></div>';$('#modal').style.display='flex'}

// ----- นักเรียน -----
function join(){const n=$('#nm').value.trim().slice(0,14);if(!n)return alert('พิมพ์ชื่อเล่นก่อนนะ');if(M.phase&&M.phase!=='lobby')return alert('เกมเริ่มไปแล้ว รอรอบหน้านะ');
 root.child('cnt').transaction(c=>(c||0)<100?(c||0)+1:undefined,(e,ok)=>{if(!ok)return alert('ห้องเต็มแล้ว (สูงสุด 100 คน)');const r=root.child('players').push({name:n,ts:Date.now()});ID=r.key;localStorage.ccgId=ID;attach();render()})}
let SEL='';
function picker(){return '<select id="sel" onchange="SEL=this.value"><option value="">— เลือกสารประกอบที่จะวาง —</option>'+R.map((r,i)=>'<option value="'+i+'"'+(SEL===''+i?' selected':'')+'>'+r.f+' · '+esc(r.th)+'</option>').join('')+'</select><p></p><button class="go" onclick="tryLay()">🗣️ เอ่ยชื่อและวางไพ่</button>'}
function tryLay(){if(SEL==='')return alert('เลือกสารประกอบก่อนนะ');const i=+SEL,r=R[i],h=(T[MYT]&&T[MYT].hands&&T[MYT].hands[ID])||[];if(!can(h,r.c))return alert('ไพ่ในมือยังไม่ครบสำหรับ '+r.f+' ลองคิดดูอีกทีนะ 🤔');ask(i)}
function studentView(){
 if(!ID)return '<div class="card" style="text-align:center"><h2>🧪 เข้าร่วมเกม</h2><p>พิมพ์ชื่อเล่นของเธอ</p><input id="nm" maxlength="14" placeholder="ชื่อเล่น"><p></p><button class="go" onclick="join()">เข้าร่วม ✨</button></div>';
 if(!P[ID])return '<div class="card">กำลังโหลด...</div>';
 const ph=M.phase||'lobby',ids=Object.keys(P);
 if(!MYT)return '<div class="card" style="text-align:center"><h2>🎉 สวัสดี '+esc(P[ID].name)+'!</h2><p>'+(ph==='lobby'?'รอคุณครูกดเริ่มเกมนะ ⏳':'เกมเริ่มไปแล้ว รอรอบหน้านะ')+'</p><div style="font-size:3rem;animation:fl 2s infinite">🧬</div><p>เพื่อน ๆ ที่เข้ามาแล้ว ('+ids.length+')</p>'+ids.map(i=>'<span class="chip">'+esc(P[i].name)+'</span>').join('')+'</div>';
 const t=T[MYT];if(!t)return '<div class="card">กำลังโหลดโต๊ะ...</div>';
 nz(t);const me=ID,cur=t.ps[t.turn],play=t.st==='play',mine=play&&cur===me,h=t.hands[me];
 let s='<div class="card"><div class="row"><h3 style="margin:0">🎲 โต๊ะ '+MYT.slice(1)+'</h3><span class="chip">🎴 กอง '+t.deck.length+' ใบ</span>'+(t.fin>=0?'<span class="chip">⏰ รอบสุดท้าย (วางอย่างเดียว ไม่จั่ว)</span>':'')+'</div>';
 s+=t.ps.map(p=>'<div class="chip '+(p===me?'me':'')+'" style="'+(play&&p===cur?'background:#ffb8d6':'')+'">'+(play&&p===cur?'👉 ':'')+esc(t.nm[p])+' · '+t.hands[p].length+' ใบ'+(t.laid[p]?'<br><small>✅ '+t.laid[p].join(' ')+'</small>':'')+'</div>').join('')+'</div>';
 if(!play){const L=rank(t);s+='<div class="card"><h2>🏁 จบเกม!</h2>'+winners(t)+'<table>'+L.map((x,i)=>'<tr class="'+(x.p===me?'me':'')+'"><td>'+(['🥇','🥈','🥉'][i]||i+1)+'</td><td>'+esc(x.n)+'</td><td>เลขอะตอมรวม '+x.z+'</td><td>'+x.c+' ใบ</td></tr>').join('')+'</table></div>'}
 s+='<div class="card"><h3>🃏 ไพ่ในมือ ('+h.length+') · เลขอะตอมรวม '+zs(h)+'</h3><div class="hand">'+(h.slice().sort((a,b)=>Z[a].z-Z[b].z).map(x=>'<div class="el g'+Z[x].g+'"><b>'+x+'</b><small>'+Z[x].n+'</small><small>Z='+Z[x].z+'</small></div>').join('')||'<i>ไม่มีไพ่แล้ว 🎉</i>')+'</div></div>';
 if(play){
  if(!mine)s+='<div class="card">⏳ รอ <b>'+esc(t.nm[cur])+'</b> เล่นอยู่...</div>';
  else if(!t.dr)s+='<div class="card" style="text-align:center"><h3>ถึงตาของเราแล้ว! 💖</h3><button class="go" onclick="draw()">🎴 จั่วไพ่ 1 ใบ</button></div>';
  else s+='<div class="card"><h3>✨ วางสารประกอบ (ต้องเอ่ยชื่อทุกครั้ง)</h3><p>ลองคิดดูว่าไพ่ในมือสร้างสารประกอบอะไรได้บ้าง (ดูตารางรวมที่แท็บ “สารประกอบ”) แล้วเลือกสูตรที่จะวาง</p>'+picker()+'<hr><button class="ok" onclick="endT()">✅ จบเทิร์น</button>'+(t.ld||t.fin>=0?'':' <small>(ถ้าไม่วางเลย จะจั่วเพิ่ม '+t.pen+' ใบ)</small>')+'</div>'}
 return s+'<div class="card"><h3>📣 ความเคลื่อนไหว</h3>'+(t.log.slice().reverse().map(x=>'<div>'+esc(x)+'</div>').join('')||'<i>—</i>')+'</div>'}

// ----- คุณครู -----
function login(){if($('#pw').value.trim()===PW){OK=true;sessionStorage.ccgOk='1';hostAttach();render()}else alert('รหัสผ่านไม่ถูกต้อง')}
function start(){const ids=Object.keys(P);if(ids.length<2)return alert('ต้องมีผู้เล่นอย่างน้อย 2 คน');const pen=+$('#pen').value,k=Math.ceil(ids.length/5),TT={},up={};
 for(let i=0;i<k;i++)TT['t'+(i+1)]={ps:[],nm:{},hands:{},deck:[],turn:0,dr:0,ld:0,fin:-1,pen,st:'play'};
 sh(ids).forEach((id,i)=>{const t=TT['t'+(i%k+1)];t.ps.push(id);t.nm[id]=P[id].name;up['players/'+id+'/t']='t'+(i%k+1)});
 const full=[];E.forEach(e=>{for(let i=0;i<e.c;i++)full.push(e.s)});
 Object.values(TT).forEach(t=>{t.deck=sh(full);t.ps.forEach(p=>{t.hands[p]=[];for(let i=0;i<5;i++)t.hands[p].push(t.deck.pop())})});
 up.tables=TT;up['meta/phase']='play';root.update(up)}
function restart(){if(!confirm('เริ่มใหม่? (เก็บรายชื่อผู้เล่นไว้ กลับไปห้องรอ)'))return;const up={tables:null,'meta/phase':'lobby'};Object.keys(P).forEach(i=>up['players/'+i+'/t']=null);root.update(up)}
function clearAll(){if(confirm('ล้างกระดานทั้งหมด? ผู้เล่นทุกคนจะถูกลบและต้องพิมพ์ชื่อใหม่'))root.set({meta:{phase:'lobby'}})}
function endAll(){const up={'meta/phase':'done'};Object.keys(T).forEach(k=>up['tables/'+k+'/st']='done');root.update(up)}
function skip(k){root.child('tables/'+k).transaction(t=>{if(!t||t.st!=='play')return;adv(t,0);return t})}
function hostView(){
 if(!OK)return '<div class="card" style="max-width:380px;margin:auto"><h2>🔐 หน้าคุณครู</h2><input id="pw" type="password" placeholder="รหัสผ่าน"><p></p><button class="go" onclick="login()">เข้าสู่ระบบ</button></div>';
 const ids=Object.keys(P),ks=Object.keys(T).sort((a,b)=>a.slice(1)-b.slice(1));
 if(M.phase==='play'&&ks.length&&ks.every(k=>T[k]&&T[k].st==='done'))root.child('meta/phase').set('done');
 const ph=M.phase||'lobby';
 let h='<div class="card"><h2>👩‍🏫 ควบคุมเกม</h2><p>สถานะ: <b>'+(ph==='lobby'?'รอผู้เล่น':ph==='play'?'กำลังเล่น':'จบเกม')+'</b> · ผู้เล่น '+ids.length+'/100</p><div class="row">'
 +(ph==='lobby'?'<label>ถ้าวางสารประกอบไม่ได้ จั่วเพิ่ม <select id="pen" style="width:auto"><option>0</option><option selected>1</option><option>2</option></select> ใบ</label><button class="go" onclick="start()">▶️ เริ่มเกม</button>':'<button onclick="endAll()">🏁 จบเกมทุกโต๊ะ</button>')
 +'<button onclick="restart()">🔄 เริ่มใหม่ (เก็บรายชื่อ)</button><button onclick="clearAll()">🧹 ล้างกระดาน</button></div></div>';
 if(ph==='lobby')return h+'<div class="card"><h3>🙋 เข้าร่วมแล้ว ('+ids.length+')</h3>'+(ids.map(i=>'<span class="chip">'+esc(P[i].name)+'</span>').join('')||'<i>ยังไม่มีใครเข้ามา</i>')+'</div>';
 return h+ks.map(k=>{const t=T[k];if(!t)return'';nz(t);const done=t.st==='done';
  return '<div class="card"><div class="row"><h3 style="margin:0">โต๊ะ '+k.slice(1)+'</h3><span class="chip">กอง '+t.deck.length+'</span>'+(done?'<span class="chip">🏁 จบ</span>':'<span class="chip">ตา: '+esc(t.nm[t.ps[t.turn]])+'</span><button class="sm" onclick="skip(\''+k+'\')">⏭️ ข้ามเทิร์น</button>')+'</div><table>'+t.ps.map(p=>'<tr><td>'+esc(t.nm[p])+'</td><td>'+t.hands[p].length+' ใบ</td><td>Z รวม '+zs(t.hands[p])+'</td><td>วางแล้ว '+(t.laid[p]||[]).length+' สูตร</td></tr>').join('')+'</table>'+(done?winners(t):'')+'</div>'}).join('')}

// ----- กติกา + คู่มือสารประกอบ -----
function rulesView(){return '<div class="card"><h3>📜 กติกา</h3><ol><li>ระบบจัดโต๊ะให้ โต๊ะละ 3–5 คน แต่ละโต๊ะมีกอง 150 ใบของตัวเอง แจกคนละ 5 ใบ</li><li>ถึงตาเรา: <b>จั่วไพ่ทีละ 1 ใบ</b></li><li>คิดเองว่าไพ่ในมือสร้างสารประกอบอะไรได้ (ดูตารางรวมทุกสูตรที่แท็บ “สารประกอบ”) ถ้าไพ่ครบตามสูตร วางสารประกอบได้ (วางได้หลายสูตรในเทิร์นเดียว) — <b>ทุกครั้งที่วางต้องเอ่ยชื่อสารประกอบออกเสียง</b> แล้วกดยืนยัน</li><li>ถ้าเทิร์นนั้นวางไม่ได้เลย จะจั่วเพิ่มตามที่คุณครูตั้ง</li><li>กองหมด → ทุกคนที่เหลือได้เล่นอีก 1 เทิร์น (วางอย่างเดียว ไม่จั่ว)</li><li>นับ <b>เลขอะตอมรวมของไพ่ที่เหลือในมือ ต่ำสุดชนะ</b> · เสมอ: ไพ่น้อยกว่าชนะ → ไพ่ใบหนักสุดเบากว่าชนะ → ชนะร่วม</li></ol><p>💡 ดูสูตรทั้งหมดได้ที่แท็บ “สารประกอบ”</p></div>'}
function guideView(){
 const h=null;let L=R.map((r,i)=>({r,i}));
 if(FILT==='can'&&h)L=L.filter(x=>can(h,x.r.c));else if(['ง่าย','ปานกลาง','ยาก','ตำนาน'].includes(FILT))L=L.filter(x=>x.r.t===FILT);
 return '<div class="card"><h3>📖 สารประกอบที่สร้างได้จากกองนี้ ('+R.length+' สูตร)</h3><div class="row">'+['all','ง่าย','ปานกลาง','ยาก','ตำนาน'].concat(h?['can']:[]).map(f=>'<button class="sm '+(FILT===f?'go':'')+'" onclick="FILT=\''+f+'\';render()">'+(f==='all'?'ทั้งหมด':f==='can'?'✅ สร้างได้ตอนนี้':f)+'</button>').join('')+'</div><div style="overflow-x:auto"><table><tr><th>สูตร</th><th>ชื่อไทย</th><th>English</th><th>ไพ่ที่ใช้ (เลขอะตอม)</th><th>รวม</th><th></th></tr>'
 +L.map(({r,i})=>'<tr><td><b>'+r.f+'</b></td><td>'+esc(r.th)+'</td><td>'+esc(r.en)+'</td><td>'+fmt(r.c)+(h&&!can(h,r.c)?'<br><small>ขาด '+lack(h,r.c)+'</small>':'')+'</td><td>'+r.z+'</td><td><button class="sm" onclick="sayR('+i+')">🔊</button></td></tr>').join('')
 +'</table></div></div><div class="card"><h3>⚛️ ธาตุในกอง 150 ใบ</h3><div class="hand">'+E.map(e=>'<div class="el g'+e.g+'"><b>'+e.s+'</b><small>'+e.n+'</small><small>Z='+e.z+' ×'+e.c+'</small></div>').join('')+'</div></div>'}

function render(){sync();const tabs=[['play',HOST?'👩‍🏫 คุมเกม':'🎮 เล่น'],['rules','📜 กติกา'],['guide','📖 สารประกอบ']];
 $('#app').innerHTML='<h1 style="text-align:center">🧪 ChemCompound ✨</h1><div class="tabs row" style="justify-content:center">'+tabs.map(t=>'<button class="'+(TAB===t[0]?'on':'')+'" onclick="TAB=\''+t[0]+'\';render()">'+t[1]+'</button>').join('')+'</div>'+(TAB==='rules'?rulesView():TAB==='guide'?guideView():HOST?hostView():studentView())}

if(typeof firebase==='undefined'){$('#app').innerHTML='<div class="card"><h2>⚠️ โหลด Firebase ไม่สำเร็จ</h2><p>เปิดลิงก์นี้ในเบราว์เซอร์ปกติที่ต่ออินเทอร์เน็ต (เช่น Chrome) จากลิงก์ GitHub Pages ไม่ใช่หน้าพรีวิว และลองปิดตัวบล็อกโฆษณาดูนะ</p></div>'}else if(CFG.apiKey.startsWith('ใส่')){$('#app').innerHTML='<div class="card"><h2>⚠️ ยังไม่ได้ใส่ Firebase config</h2><p>เปิดไฟล์ index.html แล้วแก้ค่า CFG ที่ส่วนบนของสคริปต์</p></div>'}
else{firebase.initializeApp(CFG);root=firebase.database().ref('ccg');root.child('meta').on('value',s=>{M=s.val()||{};render()});if(HOST&&OK)hostAttach();if(!HOST&&ID)attach();render()}
</script></body></html>
