<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChemCompound Card Game</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#ffd6e7;--b:#cfe8ff;--m:#d4f5e2;--l:#e6dcff;--y:#fff3c4;--ink:#5b4b6b}
*{box-sizing:border-box}body{margin:0;font-family:Mali,sans-serif;color:var(--ink);background:linear-gradient(135deg,#ffe3f1,#e3f0ff 50%,#e6ffef);min-height:100vh}
#app{max-width:980px;margin:auto;padding:12px}
.card{background:#fff;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 6px 18px #c9b6e133}
h1,h2,h3{margin:.3em 0}
button{font-family:inherit;font-size:1rem;border:0;border-radius:16px;padding:10px 16px;background:var(--l);color:var(--ink);cursor:pointer;font-weight:700;box-shadow:0 3px 0 #cbbbe8}
button:active{transform:translateY(2px);box-shadow:none}
button.go{background:#ffb8d6;box-shadow:0 3px 0 #f09ac0}button.ok{background:#b8ecd0;box-shadow:0 3px 0 #92d4b2}button.sm{padding:5px 10px;font-size:.85rem;margin:2px}
input,select{font-family:inherit;font-size:1.1rem;padding:10px 14px;border-radius:14px;border:2px solid var(--l);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--y);border-radius:14px;padding:4px 10px;font-size:.9rem;display:inline-block;margin:2px}
.tabs button{background:#fff}.tabs button.on{background:var(--p)}
.hand{display:flex;gap:6px;flex-wrap:wrap}
.el{width:68px;min-height:82px;border-radius:12px;text-align:center;font-weight:700;border:2px solid #fff;box-shadow:0 3px 8px #0001;padding:4px 2px;overflow:hidden}
.el b{font-size:1.4rem;display:block}.el small{font-size:.68rem;display:block}
.pick{cursor:pointer}.sel{outline:3px solid #ff7fb0;transform:translateY(-6px)}.g0{background:var(--p)}.g1{background:var(--b)}.g2{background:var(--y)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:4px 6px;border-bottom:1px dashed var(--l);text-align:left}
.me{outline:3px solid #ffb8d6}
#modal{position:fixed;inset:0;background:#5b4b6b66;display:none;align-items:center;justify-content:center;z-index:9}
#modal>div{background:#fff;border-radius:24px;padding:20px;max-width:420px;width:92%;text-align:center}
.fl{position:fixed;font-size:2rem;opacity:.35;pointer-events:none;animation:fl 8s infinite ease-in-out}
@keyframes fl{50%{transform:translateY(-20px) rotate(10deg)}}
</style></head><body>

function rankTable(t,me){const L=rank(t),last=L[L.length-1];return '<table><tr><th>อันดับ</th><th>ชื่อ</th><th>ไพ่ที่เหลือ</th><th>เลขอะตอมรวม</th></tr>'+L.map(x=>{const lose=L.length>1&&x.r>1&&x.z===last.z&&x.c===last.c&&x.m===last.m;return '<tr class="'+(x.p===me?'me':'')+'"><td>'+(['🥇','🥈','🥉'][x.r-1]||x.r)+(lose?' 💔':'')+'</td><td>'+esc(x.n)+(lose?' (แพ้)':'')+'</td><td>'+x.c+' ใบ'+(x.c?'<br><small>'+x.h.slice().sort((a,b)=>Z[a].z-Z[b].z).join(' ')+'</small>':'')+'</td><td><b>'+x.z+'</b></td></tr>'}).join('')+'</table>'}
function winners(t){const L=rank(t),w=L.filter(x=>x.z===L[0].z&&x.c===L[0].c&&x.m===L[0].m);return '<p>🏆 ผู้ชนะ: <b>'+w.map(x=>esc(x.n)).join(', ')+'</b></p>'}

function adv(t,pen){nz(t);const p=t.ps[t.turn],h=t.hands[p];
 if(pen&&t.fin<0&&!t.ld){let n=0;for(let i=0;i<t.pen&&t.deck.length;i++){h.push(t.deck.pop());n++}if(n)lg(t,'🎴 '+t.nm[p]+' วางสารประกอบไม่ได้ จั่วเพิ่ม '+n+' ใบ')}
 if(t.fin>=0)t.fin--;else if(!t.deck.length)t.fin=t.ps.length-1;
 if(t.fin===0){t.st='done';lg(t,'🏁 จบเกมโต๊ะนี้!');return}
 t.turn=(t.turn+1)%t.ps.length;t.ld=0;t.dr=(!t.deck.length||t.fin>=0)?1:0;t.dl=t.dr?NOW()+TL:0}
function mv(fn){root.child('tables/'+MYT).transaction(t=>{if(!t||t.st!=='play'||t.ps[t.turn]!==ID)return;nz(t);return fn(t)===false?undefined:t})}
const draw=()=>mv(t=>{if(t.dr)return false;if(t.deck.length)t.hands[ID].push(t.deck.pop());t.dr=1;t.dl=NOW()+TL});
const endT=()=>mv(t=>{if(!t.dr)return false;adv(t,1)});
function lay(i){closeM();SELI=[];const r=R[i];mv(t=>{if(!t.dr)return false;const h=t.hands[ID].slice();for(const c of r.c){const k=h.indexOf(c);if(k<0)return false;h.splice(k,1)}t.hands[ID]=h;(t.laid[ID]=t.laid[ID]||[]).push(r.f);t.ld++;lg(t,'📣 '+t.nm[ID]+' เอ่ยชื่อ “'+r.th+'” ('+r.f+') แล้ววางไพ่ '+r.c.length+' ใบ')})}
function sayR(i){try{speechSynthesis.cancel();[[R[i].th.replace(/\(.*?\)/g,''),'th-TH'],[R[i].en,'en-US']].forEach(([x,l])=>{const u=new SpeechSynthesisUtterance(x);u.lang=l;speechSynthesis.speak(u)})}catch(e){}}
function ask(i){const r=R[i];$('#modal').innerHTML='<div><h2>📣 เอ่ยชื่อให้เพื่อนฟัง!</h2><h1 style="margin:.2em">'+esc(r.th)+'</h1><h3>'+r.f+' · '+esc(r.en)+'</h3><p>ใช้ไพ่: '+fmt(r.c)+'</p><button class="sm" onclick="sayR('+i+')">🔊 ฟังเสียงอ่าน</button><p>อ่านชื่อสารประกอบออกเสียงดัง ๆ ก่อน แล้วกดยืนยัน</p><div class="row" style="justify-content:center"><button class="ok" onclick="lay('+i+')">🗣️ เอ่ยแล้ว วางไพ่!</button><button onclick="closeM()">ยกเลิก</button></div></div>';$('#modal').style.display='flex'}

 const t=T[MYT];if(!t)return '<div class="card">กำลังโหลดโต๊ะ...</div>';

 s+=t.ps.map(p=>'<div class="chip '+(p===me?'me':'')+'" style="'+(play&&p===cur?'background:#ffb8d6':'')+'">'+(play&&p===cur?'👉 ':'')+esc(t.nm[p])+' · '+t.hands[p].length+' ใบ'+(t.laid[p]?'<br><small>✅ '+t.laid[p].join(' ')+'</small>':'')+'</div>').join('')+'</div>';
 if(!play){s+='<div class="card"><h2>🏁 จบเกม! สรุปอันดับโต๊ะนี้</h2>'+winners(t)+rankTable(t,me)+'</div>'}
 if(!(mine&&t.dr))SELI=[];SELI=SELI.filter(i=>i<h.length);
 s+='<div class="card"><h3>🃏 ไพ่ในมือ ('+h.length+') · เลขอะตอมรวม '+zs(h)+'</h3><div class="hand">'+(h.map((x,i)=>[x,i]).sort((a,b)=>Z[a[0]].z-Z[b[0]].z||a[1]-b[1]).map(([x,i])=>'<div class="el g'+Z[x].g+(SELI.includes(i)?' sel':'')+((mine&&t.dr)?' pick" onclick="tog('+i+')':'')+'"><b>'+x+'</b><small>'+Z[x].n+'</small><small>Z='+Z[x].z+'</small></div>').join('')||'<i>ไม่มีไพ่แล้ว 🎉</i>')+'</div></div>';
 if(play){
  if(!mine)s+='<div class="card">⏳ รอ <b>'+esc(t.nm[cur])+'</b> เล่นอยู่...</div>';
  else if(!t.dr)s+='<div class="card" style="text-align:center"><h3>ถึงตาของเราแล้ว! 💖</h3><button class="go" onclick="draw()">🎴 จั่วไพ่ 1 ใบ</button></div>';
  else s+='<div class="card"><h3>✨ วางสารประกอบ (ต้องเอ่ยชื่อทุกครั้ง)</h3><p>⏱️ มีเวลาไม่เกิน 30 วินาทีต่อเทิร์น หมดเวลาแล้วจบเทิร์นอัตโนมัติ</p><p>คลิกการ์ดในมือที่จะรวมเป็นสารประกอบ แล้วกดยืนยัน (เลือกแล้ว '+SELI.length+' ใบ: '+SELI.map(i=>h[i]).join(' ')+')</p><button class="go" onclick="build()">🗣️ ยืนยัน แล้วเอ่ยชื่อ</button> <button class="sm" onclick="SELI=[];render()">ล้างที่เลือก</button>'+'<hr><button class="ok" onclick="endT()">✅ จบเทิร์น</button>'+(t.ld||t.fin>=0?'':' <small>(ถ้าไม่วางเลย จะจั่วเพิ่ม '+t.pen+' ใบ)</small>')+'</div>'}
 return s+'<div class="card"><h3>📣 ความเคลื่อนไหว</h3>'+(t.log.slice().reverse().map(x=>'<div>'+esc(x)+'</div>').join('')||'<i>—</i>')+'</div>'+guideView()}

function login(){if($('#pw').value.trim()===PW){OK=true;sessionStorage.ccgOk='1';hostAttach();render()}else alert('รหัสผ่านไม่ถูกต้อง')}
function start(){const ids=Object.keys(P);if(ids.length<2)return alert('ต้องมีผู้เล่นอย่างน้อย 2 คน');const pen=+$('#pen').value,k=Math.ceil(ids.length/5),TT={},up={};
 for(let i=0;i<k;i++)TT['t'+(i+1)]={ps:[],nm:{},hands:{},deck:[],turn:0,dr:0,dl:0,ld:0,fin:-1,pen,st:'play'};
 sh(ids).forEach((id,i)=>{const t=TT['t'+(i%k+1)];t.ps.push(id);t.nm[id]=P[id].name;up['players/'+id+'/t']='t'+(i%k+1)});
 const full=[];E.forEach(e=>{for(let i=0;i<e.c;i++)full.push(e.s)});
 Object.values(TT).forEach(t=>{t.deck=sh(full);t.ps.forEach(p=>{t.hands[p]=[];for(let i=0;i<5;i++)t.hands[p].push(t.deck.pop())})});
 up.tables=TT;up['meta/phase']='play';root.update(up)}

const strip=a=>a.map(r=>({f:r.f,th:r.th,en:r.en,c:r.c}));
const save=l=>root.child('recipes').set(strip(l));
function addR(){if((M.phase||'lobby')!=='lobby')return alert('เพิ่ม/ลบสารประกอบได้เฉพาะตอนอยู่ห้องรอนะคะ');const f0=AF.f.trim(),th=AF.th.trim(),en=AF.en.trim();if(!f0||!th)return alert('ใส่สูตรและชื่อไทยก่อนนะคะ');let o;try{o=parseF(norm(f0))}catch(e){return alert('อ่านสูตรไม่ออก ลองพิมพ์แบบ Ca(CN)2 ดูนะคะ')}
 const c=[];for(const k in o){if(!Z[k])return alert('ธาตุ '+k+' ไม่มีในกองไพ่');if(o[k]>Z[k].c)return alert('สูตรนี้ใช้ '+k+' '+o[k]+' ใบ แต่ในกองมีแค่ '+Z[k].c+' ใบ');for(let i=0;i<o[k];i++)c.push(k)}
 if(!c.length)return alert('อ่านสูตรไม่ออกค่ะ');
 const key=JSON.stringify(c.slice().sort());if(R.some(r=>JSON.stringify(r.c.slice().sort())===key))return alert('มีสารประกอบที่ใช้ไพ่ชุดเดียวกันนี้อยู่แล้วค่ะ');
 save(R.concat([{f:subf(norm(f0)),th,en:en||'-',c}]));AF={f:'',th:'',en:''}}
